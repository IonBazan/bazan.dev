<div id="header">
    <div class="columns is-multiline is-vcentered">
        <div id="title" class="column is-12 has-text-centered">
<!--                <img-->
<!--                        class="profile-image border"-->
<!--                        src="{{ ((resources.Get "img/profile.jpeg").Process "resize 600x q100 webp").RelPermalink }}"-->
<!--                width="100%"-->
<!--                height="100%"-->
<!--                alt="{{ .name }}"-->
<!--                >-->
                <h1 class="has-text-weight-bold">{{ .name }}</h1>
        </div>
        {{ with .contact }}
        <div id="contact" class="column is-12 is-size-7">
            <div class="columns is-mobile is-multiline is-centered is-variable is-2">
                <div class="column is-half-mobile is-narrow-tablet has-text-left">
                    <i class="fas fa-phone-square fa-fw fa-lg"></i>
                    <a class="has-text-dark" href="tel:{{ .phone }}">{{ .phone }}</a>
                </div>
                <div class="column is-half-mobile is-narrow-tablet has-text-left">
                    <i class="fas fa-envelope-square fa-fw fa-lg"></i>
                    <a class="has-text-dark" href="mailto:{{ .email }}">{{ .email }}</a>
                </div>
                <div class="column is-half-mobile is-narrow-tablet has-text-left">
                    <i class="fab fa-github-square fa-fw fa-lg"></i>
                    <a class="has-text-dark" href="https://github.com/{{ .github }}">{{ .github }}</a>
                </div>
                <div class="column is-half-mobile is-narrow-tablet has-text-left">
                    <i class="fab fa-linkedin fa-fw fa-lg"></i>
                    <a class="has-text-dark" href="https://{{ .linkedin }}">{{ .linkedin }}</a>
                </div>
                <div class="column is-half-mobile is-narrow-tablet has-text-left has-text-centered-mobile">
                    <i class="fas fa-map-marker-alt fa-fw fa-lg"></i>
                    {{ .location }}
                </div>
            </div>
        </div>
        {{ end }}
    </div>
</div>
