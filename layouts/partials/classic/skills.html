<section class="print-page-break-avoid">
    <h4 class="section-heading">Skills & Tools</h4>
    <ul>
        {{ range . }}
        <li class="columns">
            <div class="column is-3">
                <span class="has-text-weight-bold">{{ .name }}</span>
            </div>
            <div class="column is-9">
                {{ delimit .skills ", " }}
            </div>
        </li>
        {{ end }}
    </ul>
</section>
