<section id="experience">
    <h4 class="section-heading">Work Experience</h4>
    <div>
        {{ range sort . "start" "desc" }}
        <div class="item is-relative print-page-break-avoid">
            <div class="columns is-multiline is-vcentered mb-2">
                <h5 class="mb-0 column is-12">
                    {{ .position }}
                </h5>
                <div class="column is-6 has-text-grey">
                   {{ .company }} • {{ .country }}
                </div>
                <div class="column is-6 has-text-grey has-text-right">
                    {{ partial "_timerange.html" . }}
                </div>
            </div>
            <p class="mb-0">{{ .description | markdownify }}</p>
            {{ if .technologies }}
            <p>
                {{ range .technologies }}
                <span class="tag is-rounded">{{ . }}</span>
                {{ end }}
            </p>
            {{ end }}
        </div>
        {{ end }}
    </div>
</section>
