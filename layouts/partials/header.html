<div id="header">
    <div class="columns is-vcentered">
        <div id="title" class="column is-8 is-align-items-center is-flex">
            <div class="mb-3 mb-md-0 ml-md-0 mr-md-5 is-flex-shrink-0">
                <img
                        class="profile-image border"
                        src="{{ ((resources.Get "img/profile.jpeg").Process "resize 600x q100 webp").RelPermalink }}"
                        width="100%"
                        height="100%"
                        alt="{{ .name }}"
                >
            </div>
            <div class="has-text-left ml-3">
                <h1 class="mb-0 has-text-weight-bold">{{ .name }}</h1>
                <h2 class="mb-3 mb-md-0 h5">{{ .position }}</h2>
            </div>
        </div>
        {{ with .contact }}
        <div id="contact" class="column is-4 is-size-7">
            <ul class="mb-0">
                <li class="mb-2">
                    <i class="fas fa-phone-square fa-fw fa-lg mr-2"></i>
                    <a class="has-text-dark" href="tel:{{ .phone }}">{{ .phone }}</a>
                </li>
                <li class="mb-2">
                    <i class="fas fa-envelope-square fa-fw fa-lg mr-2"></i>
                    <a class="has-text-dark" href="mailto:{{ .email }}">{{ .email }}</a>
                </li>
                <li class="mb-2">
                    <i class="fas fa-globe-asia fa-fw fa-lg mr-2"></i>
                    <a class="has-text-dark" href="https://{{ .website }}">{{ .website }}</a>
                </li>
                <li class="mb-2">
                    <i class="fab fa-github-square fa-fw fa-lg mr-2"></i>
                    <a class="has-text-dark" href="https://github.com/{{ .github }}">@{{ .github }}</a>
                </li>
                <li class="mb-2">
                    <i class="fab fa-linkedin fa-fw fa-lg mr-2"></i>
                    <a class="has-text-dark" href="https://{{ .linkedin }}">{{ .linkedin }}</a>
                </li>
                <li class="mb-0 has-text-dark">
                    <i class="fas fa-map-marker-alt fa-fw fa-lg mr-2"></i>
                    {{ .location }}
                </li>
            </ul>
        </div>
        {{ end }}
    </div>
</div>
