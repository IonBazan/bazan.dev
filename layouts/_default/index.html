{{- define "hero" -}}
    {{ with hugo.Data.resume }}
    <header class="main-avatar">
        <div class="mb-3 is-flex-shrink-0">
            <img
                    class="profile-image shadow"
                    src="{{ ((resources.Get "img/profile.jpeg").Process "resize 600x q100 webp").RelPermalink }}"
            width="100%"
            height="100%"
            alt="{{ .name }} profile photo"
            >
        </div>
    </header>
    <section class="main-details">
        <h1 class="mb-0">{{ .name }}</h1>
        <h2 class="mb-0 h4">{{ .position }}</h2>
        {{ partial "socials.html" .contact }}
        <p class="mt-3 has-text-grey">
            {{ $.Page.Content }}
            {{ .summary | markdownify }}
        </p>
    </section>
    {{ end }}
    <footer class="main-links">
        <nav class="is-flex is-justify-content-center is-flex-wrap-wrap">
            {{- range .Site.Menus.footer }}
                <a class="px-3 py-2" href="{{ .URL }}">{{ .Name }}</a>
            {{- end }}
        </nav>
    </footer>
{{- end -}}
